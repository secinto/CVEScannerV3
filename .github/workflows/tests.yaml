name: Tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requirements.txt is deliberately >= rather than pinned so a newer
        # interpreter can resolve compatible wheels. That only holds if both
        # ends of the supported range are actually exercised.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: extra/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r extra/requirements.txt

      - name: Run the suite
        # extra/ rather than a file list: test_cvescan.py and test_database.py
        # are both here, and a new test file should not need a workflow edit.
        run: python -m pytest extra/ -q

  import-check:
    name: Modules import without their optional deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # No requirements installed on purpose. cvescan is imported by consumers
      # (checkfix_test's cve_pipeline) that do not necessarily have the build
      # tooling's dependencies, and an import-time sys.exit or a bare
      # module-level use of a missing library turns that into a crash in the
      # caller rather than a clear error here.
      - name: cvescan imports with no third-party packages present
        run: python -c "import sys; sys.path.insert(0, 'extra'); import cvescan"
